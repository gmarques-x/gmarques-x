# Redraws the profile's live images and publishes them to the `output` branch:
#   snake-{dark,light}.svg     contribution graph animation (Platane/snk)
#   specimen-{dark,light}.svg  field-notes card (scripts/render.py)
#   stats-{dark,light}.svg     measurements card (scripts/render.py)
name: Grow profile cards

on:
  schedule:
    - cron: "17 5 * * *"   # daily, 05:17 UTC
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Dot colors step from the empty-day color to Everforest green.
      # The in-between greens are derived; the ends come from the palette.
      - name: Draw contribution animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?color_snake=#DBBC7F&color_dots=#343F44,#425047,#5E7552,#83A06A,#A7C080
            dist/snake-light.svg?color_snake=#DFA000&color_dots=#EAE4CA,#E5E6C5,#C3CF8A,#A6B84E,#8DA101

      - name: Render field-notes cards
        run: python3 scripts/render.py --out dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: Update profile cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
