# Redraws the profile's live images and publishes them to the `output` branch:
#   snake-{dark,light}.svg     contribution graph animation (Platane/snk)
#   specimen-{dark,light}.svg  field-notes card (scripts/render.py)
#   stats-{dark,light}.svg     measurements card (scripts/render.py)
name: Grow profile cards

on:
  schedule:
    - cron: "17 5 * * *"   # daily, 05:17 UTC
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Dots step from the empty day to the marker orange, every step a palette
      # colour (Atlas Night, Atlas Paper; scripts/check_palette.py checks).
      - name: Draw contribution animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?color_snake=#F07A1F&color_dots=#283236,#3A4448,#4D585C,#E8CB6C,#F07A1F
            dist/snake-light.svg?color_snake=#F07A1F&color_dots=#EADCB9,#D9C79E,#C9B48C,#6A530E,#F07A1F

      - name: Check colours against Atlas
        run: python3 scripts/check_palette.py

      - name: Render field-notes cards
        run: python3 scripts/render.py --out dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          commit_message: Update profile cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
